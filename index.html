<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0B0908">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Rackside">
  <title>Rackside — Training</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div id="app">
  <section id="view-today" class="view"></section>
  <section id="view-plan" class="view" hidden></section>
  <section id="view-cardio" class="view" hidden></section>
  <section id="view-stats" class="view" hidden></section>
  <section id="view-library" class="view" hidden></section>
  <section id="view-profile" class="view" hidden></section>
  <section id="view-workout" class="view stack" hidden></section>
  <section id="view-summary" class="view stack" hidden></section>
  <section id="view-planmaker" class="view stack" hidden></section>
  <section id="view-about" class="view stack" hidden></section>
  <section id="view-prefs" class="view stack" hidden></section>
  <section id="view-detail" class="view stack full" hidden></section>
</div>

<nav class="tabbar" id="tabbar">
  <button data-view="today" class="active">
    <svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>
    Today
  </button>
  <button data-view="plan">
    <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
    Plan
  </button>
  <button data-view="cardio">
    <svg viewBox="0 0 24 24"><path d="M20.8 8.6a4.6 4.6 0 0 0-8.8-1.8 4.6 4.6 0 0 0-8.8 1.8c0 5 8.8 10.4 8.8 10.4s8.8-5.4 8.8-10.4z"/></svg>
    Cardio
  </button>
  <button data-view="stats">
    <svg viewBox="0 0 24 24"><path d="M3 20h18"/><path d="M4 16l5-6 4 3 6-8"/></svg>
    Stats
  </button>
  <button data-view="library">
    <svg viewBox="0 0 24 24"><path d="M2 12h3M19 12h3M7 12h10"/><rect x="5" y="7" width="2.6" height="10" rx="1"/><rect x="16.4" y="7" width="2.6" height="10" rx="1"/><rect x="8.5" y="9" width="2" height="6" rx="1"/><rect x="13.5" y="9" width="2" height="6" rx="1"/></svg>
    Blocks
  </button>
  <button data-view="profile">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4.5 20.5c1.6-3.8 4.6-5.5 7.5-5.5s5.9 1.7 7.5 5.5"/></svg>
    Profile
  </button>
</nav>

<!-- floating rest pill (visible outside the workout screen while resting) -->
<div id="timer-pill" hidden>
  <span id="pill-time">0:00</span>
  <button id="pill-cancel" type="button">✕</button>
</div>

<!-- ============ SHEETS ============ -->
<div id="sheet-backdrop" hidden></div>

<!-- Add an exercise to the session you are in -->
<div id="sheet-addex" class="sheet" hidden>
  <div class="sheet-handle"></div>
  <button type="button" class="sheet-x" data-close aria-label="Close">✕</button>
  <h2>Add to this session</h2>
  <div id="addex-body"></div>
</div>

<!-- A ready-made block, opened for reading -->
<div id="sheet-ready" class="sheet tall" hidden>
  <div class="sheet-handle"></div>
  <button type="button" class="sheet-x" data-close aria-label="Close">✕</button>
  <h2 id="sheet-ready-title"></h2>
  <div id="sheet-ready-body"></div>
</div>

<!-- Add / edit custom exercise -->
<div id="sheet-exercise" class="sheet" hidden>
  <div class="sheet-handle"></div>
  <button type="button" class="sheet-x" data-close aria-label="Close">✕</button>
  <h2 id="sheet-exercise-title">New exercise</h2>
  <form id="form-exercise">
    <label>Name
      <input name="name" type="text" required placeholder="e.g. Bench Press" autocomplete="off">
    </label>
    <label>Muscle group
      <select name="group">
        <option>Chest</option><option>Back</option><option>Shoulders</option>
        <option>Arms</option><option>Legs</option><option>Core</option>
        <option>Cardio</option><option>Full body</option><option>Other</option>
      </select>
    </label>
    <label>How hard it is
      <select name="hardship">
        <option value="1">Beginner — easy to do right</option>
        <option value="2">Intermediate — needs practice</option>
        <option value="3">Advanced — technique-heavy</option>
      </select>
    </label>
    <label>Form cues / notes
      <textarea name="notes" rows="2" placeholder="Cues, machine settings, seat height…"></textarea>
    </label>
    <label class="file-label">
      <span>Photos / videos</span>
      <input id="exercise-media-input" type="file" accept="image/*,video/*" multiple>
      <span class="file-button">📷 Add photo or video</span>
    </label>
    <div id="media-preview" class="media-edit-strip"></div>
    <div class="sheet-actions">
      <button type="button" class="btn-sheet-ghost" data-close>Cancel</button>
      <button type="submit" class="btn-sheet-lime">Save</button>
    </div>
  </form>
</div>

<!-- Plan (block) builder -->
<div id="sheet-plan" class="sheet tall" hidden>
  <div class="sheet-handle"></div>
  <button type="button" class="sheet-x" id="plan-x" aria-label="Close">✕</button>
  <h2 id="sheet-plan-title">New block</h2>
  <form id="form-plan">
    <label>Block name
      <input name="name" type="text" required placeholder="e.g. Block 1 — Strength" autocomplete="off">
    </label>
    <label>Length
      <div id="plan-weeks"></div>
    </label>
    <div id="plan-weeks-note" class="ab-hint"></div>
    <div class="micro" style="margin: 4px 0 10px">Training days · rep targets are ranges (e.g. 8–12)</div>
    <div id="plan-days"></div>
    <button type="button" id="plan-add-day" class="pf-add">＋ Add training day</button>
    <button type="submit" hidden></button>
  </form>
</div>

<!-- Paused session — nothing runs behind this -->
<div id="pause-pop" hidden>
  <div id="pause-pop-card">
    <div id="pause-pop-tag">Paused for</div>
    <div id="pause-pop-time" class="num">0:00</div>
    <div id="pause-pop-held" class="num"></div>
    <div id="pause-pop-body"></div>
    <button id="pause-pop-go" class="btn-cta big">Start again</button>
    <button id="pause-pop-quit">Discard session</button>
  </div>
</div>

<!-- Number pad — typing a weight or a hold, without the system keyboard -->
<div id="num-pop" hidden>
  <div id="num-pop-card">
    <div id="num-pop-tag"></div>
    <div id="num-pop-val" class="num">0<small></small></div>
    <div id="num-pop-keys"></div>
    <div id="num-pop-acts">
      <button id="num-pop-cancel">Cancel</button>
      <button id="num-pop-ok" class="btn-cta">Save</button>
    </div>
  </div>
</div>

<!-- Hold timer — a countdown you can read from the floor -->
<div id="hold-pop" hidden>
  <div id="hold-pop-card">
    <div id="hold-pop-name"></div>
    <div id="hold-pop-phase"></div>
    <div id="hold-pop-time" class="num">0:00</div>
    <div id="hold-pop-bar"><i></i></div>
    <div id="hold-pop-steps" hidden></div>
    <div id="hold-pop-acts">
      <button id="hold-pop-hold">Pause</button>
      <button id="hold-pop-stop">Stop</button>
    </div>
  </div>
</div>

<!-- Media viewer -->
<div id="media-viewer" hidden>
  <button id="media-viewer-close">✕</button>
  <div id="media-viewer-body"></div>
</div>

<script src="js/db.js"></script>
<script src="js/library.js"></script>
<script src="js/plans.js"></script>
<script src="js/equip-icons.js"></script>
<script src="js/anatomy.js"></script>
<script src="js/app.js"></script>
</body>
</html>
